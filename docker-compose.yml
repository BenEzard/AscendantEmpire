services:
  sql-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ascendantempire-sql-test
    ports:
      - "14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      # Must meet SQL Server complexity rules (upper, lower, digit, symbol, ≥8 chars).
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
