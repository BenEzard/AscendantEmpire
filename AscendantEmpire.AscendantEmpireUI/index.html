<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascendant Empire</title>
    <style>
      /* Minimal standalone styling — this landing page mounts no React/feature code. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
      }
      nav {
        /* Stack the card rows vertically; each .row lays its cards out horizontally. */
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .row {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      a {
        /* Sized like a standard playing card (2.5" × 3.5", a 5:7 ratio). */
        width: 200px;
        height: 280px;
        /* Centre the label both ways within the card. */
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 1px solid #334155;
        border-radius: 0.75rem;
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.25rem;
      }
      a:hover {
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <h1>Ascendant Empire</h1>
    <nav>
      <div class="row">
        <a href="/matchmaker/">Match-Maker</a>
        <a href="/game/">Game</a>
        <a href="/system/">System</a>
      </div>
      <div class="row">
        <a href="/mapeditor/">Map Editor</a>
        <a href="/entitysetuptool/">Entity Setup Tool</a>
      </div>
    </nav>
  </body>
</html>
